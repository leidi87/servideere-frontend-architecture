<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servi Deere | Reparación de Maquinaria</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="servi-icon.jpg" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <a href="https://wa.me/573176677848" class="whatsapp-btn" target="_blank">
        <i class="fab fa-whatsapp"></i>
    </a>
    <header class="header">
        <div class="header__container">
            <img src="LOGO.jpg" alt="Logo Servi Deere" class="header__logo">
            <h1 class="header__title">Reparación de Maquinaria John Deere</h1>
        </div>
    </header>
    <main class="container">
        <section class="services">
            <h2 class="section-title">Nuestros Servicios</h2>
            <div class="services-grid">
                <article class="card">
                    <i class="fas fa-tractor card__icon"></i>
                    <h3 class="card__title">Mantenimiento</h3>
                    <p class="card__text">Servicio técnico especializado en Piedras, Tolima.</p>
                </article>
                <article class="card">
                    <i class="fas fa-cogs card__icon"></i>
                    <h3 class="card__title">Repuestos</h3>
                    <p class="card__text">Distribución de partes originales.</p>
                </article>
            </div>
        </section>
        <section class="contact">
            <h2 class="section-title">Contáctanos</h2>
            <form id="contact-form" class="form">
                <input type="text" id="name" placeholder="Tu Nombre" class="form__input" required>
                <input type="tel" id="phone" placeholder="Tu Teléfono" class="form__input" required>
                <textarea id="message" placeholder="¿Cómo podemos ayudarte?" class="form__input form__input--area" required></textarea>
                <button type="submit" class="form__submit">Enviar Solicitud</button>
            </form>
        </section>
    </main>
    <footer class="footer">
        <div class="footer__socials">
            <a href="https://www.tiktok.com/" target="_blank" class="footer__link"><i class="fab fa-tiktok"></i> TikTok</a>
            <a href="https://www.facebook.com/" target="_blank" class="footer__link"><i class="fab fa-facebook"></i> Facebook</a>
        </div>
        <p class="footer__location">Piedras, Tolima - Colombia</p>
    </footer>
    <script src="app.js"></script>
</body>
</html>
</body>
</html>
